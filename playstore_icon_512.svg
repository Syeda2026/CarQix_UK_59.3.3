<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Royal Blue Circle Gradient -->
    <linearGradient id="blueCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 512x512 Canvas with Google Play Corner Radius (102px) -->
  <rect width="512" height="512" rx="102" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="101" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Royal Blue Circle Container -->
  <circle cx="256" cy="182" r="116" fill="url(#blueCircleGrad)" filter="url(#dropShadow)"/>

  <!-- Centered Car Logo Emblem inside Blue Circle -->
  <g transform="translate(154, 80) scale(1.85)">
    <!-- Top Speed / Deal Wing Accent (Gold) -->
    <path fill="#FBBF24" d="M 28,30 L 76,30 C 78,30 80,31.5 81,33.5 L 75,37.5 L 34,37.5 C 31,37.5 28,35.5 27,33 C 26.5,31.5 27,30 28,30 Z" />

    <!-- Verified Deal / Buy-Sell Price Tag & Star Badge (Red & Gold) -->
    <path fill="#EF4444" d="M 74,22 L 85,33 L 78,40 L 67,29 Z" />
    <path fill="#FFFFFF" d="M 76,27 C 77.1,27 78,27.9 78,29 C 78,30.1 77.1,31 76,31 C 74.9,31 74,30.1 74,29 C 74,27.9 74.9,27 76,27 Z" />
    
    <!-- Modern Used Car Body (White) -->
    <path fill="#FFFFFF" d="M 38,42 C 41,39 46,38 52,38 L 62,38 C 68,38 73,40 76,44 L 83,52 C 86,54 87,56.5 87,60 L 87,66 C 87,68.2 85.2,70 83,70 L 81,70 C 81,65.5 77.5,62 73,62 C 68.5,62 65,65.5 65,70 L 43,70 C 43,65.5 39.5,62 35,62 C 30.5,62 27,65.5 27,70 L 25,70 C 22.8,70 21,68.2 21,66 L 21,59 C 21,56 22.5,53.5 25,52 Z M 39,51 L 52,51 L 52,43 L 45,43 C 42,43 40,45.5 39,51 Z M 56,51 L 73,51 L 67.5,43 L 56,43 Z" />

    <!-- Wheels & Detailed Alloy Rims -->
    <!-- Front Wheel -->
    <path fill="#FFFFFF" d="M 35,63 C 38.9,63 42,66.1 42,70 C 42,73.9 38.9,77 35,77 C 31.1,77 28,73.9 28,70 C 28,66.1 31.1,63 35,63 Z" />
    <path fill="#1D4ED8" d="M 35,66.5 C 36.9,66.5 38.5,68.1 38.5,70 C 38.5,71.9 36.9,73.5 35,73.5 C 33.1,73.5 31.5,71.9 31.5,70 C 31.5,68.1 33.1,66.5 35,66.5 Z" />
    <path fill="#FFFFFF" d="M 35,68.5 C 35.8,68.5 36.5,69.2 36.5,70 C 36.5,70.8 35.8,71.5 35,71.5 C 34.2,71.5 33.5,70.8 33.5,70 C 33.5,69.2 34.2,68.5 35,68.5 Z" />

    <!-- Rear Wheel -->
    <path fill="#FFFFFF" d="M 73,63 C 76.9,63 80,66.1 80,70 C 80,73.9 76.9,77 73,77 C 69.1,77 66,73.9 66,70 C 66,66.1 69.1,63 73,63 Z" />
    <path fill="#1D4ED8" d="M 73,66.5 C 74.9,66.5 76.5,68.1 76.5,70 C 76.5,71.9 74.9,73.5 73,73.5 C 71.1,73.5 69.5,71.9 69.5,70 C 69.5,68.1 71.1,66.5 73,66.5 Z" />
    <path fill="#FFFFFF" d="M 73,68.5 C 73.8,68.5 74.5,69.2 74.5,70 C 74.5,70.8 73.8,71.5 73,71.5 C 72.2,71.5 71.5,70.8 71.5,70 C 71.5,69.2 72.2,68.5 73,68.5 Z" />

    <!-- Sleek Front Headlight (Cyan) & Taillight (Red) -->
    <path fill="#38BDF8" d="M 22.5,56.5 L 28,56.5 C 29,56.5 29.5,57.5 28.5,58.5 L 23,58.5 C 22,58.5 21.5,57.5 22.5,56.5 Z" />
    <path fill="#EF4444" d="M 85.5,56.5 L 86.8,56.5 C 87.4,56.5 87.8,57.2 87.5,58.5 L 84.5,58.5 Z" />

    <!-- Buy/Sell Dynamic Road Line -->
    <path fill="#FBBF24" d="M 18,74 L 90,74 C 91.1,74 92,74.9 92,76 C 92,77.1 91.1,78 90,78 L 18,78 C 16.9,78 16,77.1 16,76 C 16,74.9 16.9,74 18,74 Z" />
  </g>

  <!-- Title Section "CarQix UK" - Enhanced Size & Perfectly Centered -->
  <g id="brand-title">
    <!-- "CarQix" Text -->
    <text x="126" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#0F172A" text-anchor="start" letter-spacing="-1">CarQix</text>
    
    <!-- "UK" Red Badge -->
    <g transform="translate(322, 353)">
      <rect width="64" height="42" rx="8" fill="#EF4444"/>
      <text x="32" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">UK</text>
    </g>
  </g>
</svg>
